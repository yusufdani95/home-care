<!DOCTYPE html>
<html lang="id" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Serang Nurse Care</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#082f49',
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-900 text-slate-100 font-sans h-full flex items-center justify-center p-4">

  <!-- LOGIN CARD -->
  <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-8 shadow-2xl space-y-6">

    <!-- Header Logo & Title -->
    <div class="text-center space-y-3">
      <div class="w-16 h-16 rounded-2xl bg-brand-600 flex items-center justify-center text-white font-bold mx-auto shadow-lg shadow-brand-600/30">
        <i class="fa-solid fa-user-nurse text-3xl"></i>
      </div>
      <div>
        <h1 class="text-2xl font-extrabold text-white tracking-tight">SERANG NURSE CARE</h1>
        <p class="text-sm text-slate-400 mt-1 font-medium">Masuk untuk mengakses Dashboard Admin</p>
      </div>
    </div>

    <!-- Alert Message Container -->
    <div id="error-alert" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2.5">
      <i class="fa-solid fa-circle-exclamation text-base shrink-0"></i>
      <span id="error-message">Username atau password salah.</span>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Username</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="username" name="username" required placeholder="Masukkan username"
            class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="password" id="password" name="password" required placeholder="••••••••"
            class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all">
        </div>
      </div>

      <button type="submit" id="submit-btn"
        class="w-full py-3.5 px-4 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-sm shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center gap-2 active:scale-[0.99]">
        <i class="fa-solid fa-right-to-bracket text-base"></i>
        <span>Masuk ke Admin</span>
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-700/50">
      <a href="/" class="text-xs font-semibold text-slate-400 hover:text-slate-200 transition-colors inline-flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left text-[10px]"></i> Kembali ke Website Utama
      </a>
    </div>

  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorAlert = document.getElementById('error-alert');
    const errorMessage = document.getElementById('error-message');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Mohon isi username dan password');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-base"></i> Memproses...`;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const json = await res.json();

        if (res.ok && json.success) {
          window.location.href = '/admin';
        } else {
          showError(json.message || 'Username atau password salah.');
        }
      } catch (err) {
        showError('Terjadi kesalahan koneksi server.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket text-base"></i> Masuk ke Admin`;
      }
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorAlert.classList.remove('hidden');
    }
  </script>
</body>

</html>
